spring.application.name=ms-vidasalud-analytics

server.port=8086

# ---- Kafka ----
# Desde el PC se usan los listeners externos (localhost:9092-9094).
# En Docker, KAFKA_BOOTSTRAP apunta a kafka1:29092,kafka2:29092,kafka3:29092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}

# Nombres centralizados de Kafka: los mismos topicos que usan appointments y catalog.
# Las particiones, replicas y retencion de cada topico las define ms-vidasalud-kafka-admin.
vidasalud.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
vidasalud.kafka.client-id=ms-vidasalud-analytics
vidasalud.kafka.topico-atenciones=vidasalud.atenciones.eventos
vidasalud.kafka.topico-boxes=vidasalud.boxes.estado

# Grupos de consumidores: cada grupo recibe TODOS los eventos y lleva sus propios offsets.
vidasalud.kafka.grupo-analitica=vidasalud-analitica
vidasalud.kafka.grupo-historial=vidasalud-historial

# Manejo de errores: 2 reintentos separados por 1 segundo y luego <topico>.DLT.
# Los eventos invalidos o malformados van directo a la DLT, sin reintentos.
vidasalud.kafka.reintentos=2
vidasalud.kafka.intervalo-reintento-ms=1000
# Nombre de la DLT = topico + sufijo. Debe coincidir con los topicos que crea kafka-admin.
# Se fija aqui porque Spring Kafka 4 usa "-dlt" por defecto.
vidasalud.kafka.sufijo-dlt=.DLT

# Al iniciar, el grupo de analitica relee los topicos desde el principio para
# reconstruir las metricas en memoria (retencion de 7 dias en atenciones y
# topico compactado en boxes). El historial NO relee: sigue desde su offset.
vidasalud.analitica.reconstruir-al-iniciar=true

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
